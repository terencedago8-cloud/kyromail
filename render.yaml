# Blueprint Render — déploiement de KyroMail sur https://mail.kyromail.fr
# Documentation : https://render.com/docs/blueprint-spec
#
# Configuration « 100 % gratuite » :
#   * Web Service sur le plan gratuit de Render (il s'endort après 15 min
#     d'inactivité puis se réveille au premier appel).
#   * La base de données est hébergée chez un fournisseur PostgreSQL gratuit
#     (Neon, Supabase…) : KYROMAIL_DATABASE_URL = l'URL de connexion fournie.
#     Sans cette variable, l'application retombe sur SQLite dans le disque
#     éphémère (les données seraient alors effacées à chaque déploiement).
#   * KYROMAIL_SECRET_KEY est généré automatiquement : ne jamais le versionner.
#   * KYROMAIL_ADMIN_EMAIL / KYROMAIL_ADMIN_PASSWORD sont à renseigner une
#     seule fois (premier démarrage), puis à retirer.

services:
  - type: web
    name: kyromail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    healthCheckPath: /
    envVars:
      - key: KYROMAIL_DATABASE_URL
        sync: false
      - key: KYROMAIL_HTTPS
        value: "1"
      - key: KYROMAIL_SECRET_KEY
        generateValue: true
      # Domaine interne des adresses de compte. Décommentez une fois le
      # service SMTP réel connecté (sinon les adresses ne sont pas réellement
      # délivrées et l'interface le signale).
      # - key: KYROMAIL_DOMAIN
      #   value: kyromail.fr
      - key: KYROMAIL_ADMIN_EMAIL
        sync: false
      - key: KYROMAIL_ADMIN_PASSWORD
        sync: false
      - key: KYROMAIL_ADMIN_NAME
        sync: false
